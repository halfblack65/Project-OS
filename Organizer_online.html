<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ProjectOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  :root {
    --bg: #f5f2ee;
    --surface: #fdfaf7;
    --surface2: #f0ece6;
    --surface3: #e8e2da;
    --border: rgba(140,120,100,0.12);
    --border2: rgba(140,120,100,0.22);
    --text: #3a3028;
    --text2: #7a6a5a;
    --text3: #b0a090;
    --accent: #c97a5a;
    --accent2: #b56848;
    --accent-dim: rgba(201,122,90,0.10);
    --sidebar-bg: #ede8e1;
    --red: #c0614a;
    --amber: #c49040;
    --blue: #6a90a8;
    --green: #7a9e7e;
    --purple: #9080a8;
    --teal: #6aa8a0;
    --tortora: #a89880;
    --radius: 10px;
    --radius-lg: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Nunito', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; overflow: hidden; height: 100vh; }

  .sidebar { width: 245px; min-width: 245px; background: var(--sidebar-bg); border-right: 1px solid var(--border2); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
  .sidebar-header { padding: 22px 20px 14px; border-bottom: 1px solid var(--border2); }
  .logo { font-family: 'DM Serif Display', serif; font-size: 22px; color: var(--accent); letter-spacing: -0.5px; }
  .logo span { color: var(--tortora); font-style: italic; }
  .sidebar-tagline { font-size: 11px; color: var(--text3); margin-top: 2px; }
  .sidebar-section { padding: 14px 12px 6px; }
  .sidebar-label { font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text3); padding: 0 8px; margin-bottom: 5px; }
  .sidebar-nav-item { display: flex; align-items: center; gap: 9px; padding: 8px 10px; border-radius: var(--radius); cursor: pointer; font-size: 13.5px; font-weight: 600; color: var(--text2); transition: all 0.15s; border: none; background: none; width: 100%; text-align: left; font-family: 'Nunito', sans-serif; }
  .sidebar-nav-item:hover { background: var(--surface3); color: var(--text); }
  .sidebar-nav-item.active { background: var(--accent-dim); color: var(--accent); }
  .sidebar-nav-item i { width: 16px; text-align: center; font-size: 13px; }
  .project-list { flex: 1; overflow-y: auto; padding: 0 12px 8px; }
  .project-list::-webkit-scrollbar { width: 3px; }
  .project-list::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }
  .project-item { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: var(--radius); cursor: pointer; font-size: 13px; font-weight: 600; color: var(--text2); transition: all 0.15s; }
  .project-item:hover { background: var(--surface3); color: var(--text); }
  .project-item.active { background: rgba(140,120,100,0.15); color: var(--text); }
  .project-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .project-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .project-count { font-size: 10px; background: var(--surface3); color: var(--text3); padding: 1px 6px; border-radius: 8px; font-family: 'DM Mono', monospace; }
  .project-del { opacity: 0; font-size: 11px; color: var(--text3); background: none; border: none; cursor: pointer; padding: 2px 4px; border-radius: 4px; transition: all 0.1s; }
  .project-item:hover .project-del { opacity: 1; }
  .project-del:hover { color: var(--red); }
  .btn-new-project { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: var(--radius); border: 1.5px dashed var(--border2); background: none; color: var(--text3); font-size: 12px; font-family: 'Nunito', sans-serif; font-weight: 600; cursor: pointer; width: 100%; transition: all 0.15s; margin-top: 4px; }
  .btn-new-project:hover { border-color: var(--accent); color: var(--accent); }

  .sidebar-footer { padding: 12px 14px; border-top: 1px solid var(--border2); display: flex; gap: 6px; }
  .sidebar-footer button { flex: 1; padding: 7px 6px; border-radius: var(--radius); border: 1px solid var(--border2); background: var(--surface); font-size: 11px; font-family: 'Nunito', sans-serif; font-weight: 700; cursor: pointer; transition: all 0.15s; display: flex; align-items: center; justify-content: center; gap: 5px; }
  .btn-export { color: var(--blue) !important; border-color: rgba(106,144,168,0.3) !important; }
  .btn-export:hover { background: rgba(106,144,168,0.1) !important; }
  .btn-import { color: var(--green) !important; border-color: rgba(122,158,126,0.3) !important; }
  .btn-import:hover { background: rgba(122,158,126,0.1) !important; }

  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; height: 100vh; }
  .topbar { padding: 14px 26px; border-bottom: 1px solid var(--border2); display: flex; align-items: center; gap: 14px; background: var(--surface); }
  .topbar-title { font-family: 'DM Serif Display', serif; font-size: 20px; color: var(--text); flex: 1; }
  .topbar-title span { color: var(--text3); font-size: 12px; font-family: 'DM Mono', monospace; margin-left: 10px; }
  .btn { padding: 7px 15px; border-radius: var(--radius); border: 1px solid var(--border2); background: var(--surface); color: var(--text2); font-size: 13px; font-family: 'Nunito', sans-serif; font-weight: 600; cursor: pointer; transition: all 0.15s; display: flex; align-items: center; gap: 6px; }
  .btn:hover { background: var(--surface2); color: var(--text); }
  .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn-primary:hover { background: var(--accent2); border-color: var(--accent2); }
  .tabs { display: flex; gap: 2px; padding: 10px 26px 0; border-bottom: 1px solid var(--border2); background: var(--surface); }
  .tab { padding: 7px 15px 9px; font-size: 13px; font-weight: 600; color: var(--text3); cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.15s; display: flex; align-items: center; gap: 6px; }
  .tab:hover { color: var(--text2); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .content { flex: 1; overflow-y: auto; padding: 22px 26px; background: var(--bg); }
  .content::-webkit-scrollbar { width: 5px; }
  .content::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

  .stats-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 10px; margin-bottom: 24px; }
  .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 15px 17px; }
  .stat-label { font-size: 11px; color: var(--text3); font-weight: 700; letter-spacing: 0.5px; margin-bottom: 6px; }
  .stat-value { font-size: 26px; font-family: 'DM Serif Display', serif; color: var(--text); }
  .stat-value small { font-size: 13px; color: var(--text2); font-family: 'Nunito', sans-serif; }
  .section-title { font-size: 11px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: var(--text3); margin-bottom: 11px; }

  .kanban-board { display: grid; grid-template-columns: repeat(3,1fr); gap: 14px; min-height: 380px; }
  .kanban-col { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); display: flex; flex-direction: column; min-height: 260px; }
  .kanban-col-header { padding: 12px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 7px; font-size: 11px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; }
  .kanban-col-count { font-size: 10px; background: var(--surface2); color: var(--text3); padding: 2px 7px; border-radius: 8px; font-family: 'DM Mono', monospace; }
  .kanban-cards { flex: 1; padding: 10px; display: flex; flex-direction: column; gap: 7px; }
  .kanban-card { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 11px 11px 11px 14px; cursor: pointer; transition: all 0.15s; position: relative; overflow: hidden; }
  .kanban-card:hover { border-color: var(--border2); background: var(--surface); }
  .kanban-card-title { font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text); }
  .kanban-card-meta { display: flex; align-items: center; gap: 7px; font-size: 11px; color: var(--text3); flex-wrap: wrap; }
  .tag { padding: 2px 7px; border-radius: 5px; font-size: 10px; font-weight: 700; letter-spacing: 0.3px; text-transform: uppercase; }
  .kanban-add { margin: 0 10px 10px; padding: 7px; border: 1.5px dashed var(--border2); border-radius: var(--radius); background: none; color: var(--text3); font-size: 12px; font-family: 'Nunito', sans-serif; font-weight: 600; cursor: pointer; text-align: center; transition: all 0.15s; width: calc(100% - 20px); }
  .kanban-add:hover { border-color: var(--accent); color: var(--accent); }

  .task-list { display: flex; flex-direction: column; gap: 5px; }
  .task-item { display: flex; align-items: flex-start; gap: 11px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); transition: all 0.15s; }
  .task-item:hover { border-color: var(--border2); }
  .task-check { width: 18px; height: 18px; border: 2px solid var(--border2); border-radius: 5px; flex-shrink: 0; margin-top: 1px; display: flex; align-items: center; justify-content: center; transition: all 0.15s; cursor: pointer; }
  .task-check.done { background: var(--green); border-color: var(--green); }
  .task-check.done::after { content: '✓'; color: #fff; font-size: 11px; font-weight: 800; }
  .task-body { flex: 1; cursor: pointer; }
  .task-title { font-size: 13.5px; font-weight: 600; color: var(--text); margin-bottom: 3px; }
  .task-title.done { text-decoration: line-through; color: var(--text3); }
  .task-meta { display: flex; align-items: center; gap: 9px; font-size: 11px; color: var(--text3); flex-wrap: wrap; }
  .task-due { font-family: 'DM Mono', monospace; }
  .task-due.overdue { color: var(--red); font-weight: 700; }
  .task-actions { display: flex; gap: 4px; opacity: 0; transition: opacity 0.15s; }
  .task-item:hover .task-actions { opacity: 1; }
  .icon-btn { width: 26px; height: 26px; border-radius: 6px; border: none; background: var(--surface2); color: var(--text3); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 12px; transition: all 0.15s; }
  .icon-btn.danger:hover { color: var(--red); }

  .notes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px,1fr)); gap: 11px; }
  .note-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 15px; cursor: pointer; transition: all 0.15s; min-height: 130px; }
  .note-card:hover { border-color: var(--border2); transform: translateY(-1px); }
  .note-card-title { font-size: 13.5px; font-weight: 700; margin-bottom: 7px; color: var(--text); }
  .note-card-body { font-size: 12px; color: var(--text2); line-height: 1.6; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; }
  .note-card-date { font-size: 10px; color: var(--text3); font-family: 'DM Mono', monospace; margin-top: 10px; }
  .note-card-add { border: 1.5px dashed var(--border2); background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px; cursor: pointer; min-height: 130px; border-radius: var(--radius-lg); color: var(--text3); font-size: 12px; font-family: 'Nunito', sans-serif; font-weight: 600; transition: all 0.15s; width: 100%; }
  .note-card-add:hover { border-color: var(--accent); color: var(--accent); }

  .modal-overlay { position: fixed; inset: 0; background: rgba(80,60,40,0.35); display: flex; align-items: center; justify-content: center; z-index: 100; backdrop-filter: blur(4px); opacity: 0; pointer-events: none; transition: opacity 0.2s; }
  .modal-overlay.show { opacity: 1; pointer-events: all; }
  .modal { background: var(--surface); border: 1px solid var(--border2); border-radius: var(--radius-lg); padding: 26px; width: 490px; max-width: 95vw; max-height: 90vh; overflow-y: auto; transform: translateY(10px); transition: transform 0.2s; box-shadow: 0 8px 32px rgba(80,60,40,0.12); }
  .modal-overlay.show .modal { transform: translateY(0); }
  .modal-title { font-family: 'DM Serif Display', serif; font-size: 20px; margin-bottom: 18px; color: var(--text); }
  .form-group { margin-bottom: 14px; }
  .form-label { font-size: 10px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; color: var(--text3); margin-bottom: 5px; display: block; }
  .form-input, .form-select, .form-textarea { width: 100%; padding: 8px 11px; background: var(--bg); border: 1px solid var(--border2); border-radius: var(--radius); color: var(--text); font-family: 'Nunito', sans-serif; font-size: 13.5px; transition: border-color 0.15s; }
  .form-input:focus, .form-select:focus, .form-textarea:focus { outline: none; border-color: var(--accent); }
  .form-textarea { min-height: 90px; resize: vertical; line-height: 1.6; }
  .form-select option { background: var(--surface); }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
  .color-picker { display: flex; gap: 7px; flex-wrap: wrap; }
  .color-opt { width: 22px; height: 22px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: all 0.15s; }
  .color-opt.selected { border-color: var(--text); transform: scale(1.18); }

  .note-editor-title { background: none; border: none; font-family: 'DM Serif Display', serif; font-size: 24px; color: var(--text); width: 100%; margin-bottom: 14px; border-bottom: 1.5px solid var(--border2); padding-bottom: 11px; }
  .note-editor-title:focus { outline: none; border-bottom-color: var(--accent); }
  .note-editor-body { background: none; border: none; font-family: 'Nunito', sans-serif; font-size: 14px; color: var(--text2); width: 100%; line-height: 1.8; resize: none; min-height: 320px; }
  .note-editor-body:focus { outline: none; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text3); }
  .empty-state i { font-size: 34px; margin-bottom: 14px; opacity: 0.35; display: block; }
  .empty-state p { font-size: 14px; max-width: 260px; margin: 0 auto 18px; line-height: 1.6; color: var(--text2); }
  .progress-bar-track { height: 4px; background: var(--surface3); border-radius: 2px; overflow: hidden; margin-top: 8px; }
  .progress-bar-fill { height: 100%; border-radius: 2px; background: var(--accent); transition: width 0.4s; }
  input[type="color"] { width: 34px; height: 28px; border-radius: 6px; border: 1px solid var(--border2); cursor: pointer; background: none; }

  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(16px); background: var(--text); color: var(--surface); padding: 10px 22px; border-radius: var(--radius); font-size: 13px; font-weight: 700; opacity: 0; transition: all 0.3s; pointer-events: none; z-index: 200; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .info-box { margin-top: 24px; padding: 16px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); display: flex; align-items: flex-start; gap: 14px; }
  .info-box i { font-size: 18px; color: var(--blue); flex-shrink: 0; margin-top: 2px; }
  .info-box-title { font-size: 13px; font-weight: 700; margin-bottom: 4px; }
  .info-box-body { font-size: 12px; color: var(--text2); line-height: 1.6; }

  /* ─── COLLABORATORI ─── */
  .collab-avatar { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 50%; font-size: 9px; font-weight: 800; color: #fff; letter-spacing: 0; flex-shrink: 0; border: 2px solid var(--surface); }
  .collab-avatar-lg { width: 34px; height: 34px; font-size: 13px; border: 2px solid var(--surface); }
  .collab-badge { display: inline-flex; align-items: center; gap: 5px; padding: 2px 7px 2px 3px; border-radius: 20px; font-size: 10px; font-weight: 700; }
  .collab-list { display: flex; flex-direction: column; gap: 8px; }
  .collab-item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
  .collab-info { flex: 1; }
  .collab-name { font-size: 13px; font-weight: 700; color: var(--text); }
  .collab-role { font-size: 11px; color: var(--text3); }
  .collab-del { opacity: 0; font-size: 11px; color: var(--text3); background: none; border: none; cursor: pointer; padding: 4px 6px; border-radius: 6px; transition: all 0.1s; }
  .collab-item:hover .collab-del { opacity: 1; }
  .collab-del:hover { color: var(--red); }

  /* ─── CALENDARIO ─── */
  .cal-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; }
  .cal-header { display: flex; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--border); gap: 12px; }
  .cal-month { font-family: 'DM Serif Display', serif; font-size: 18px; color: var(--text); flex: 1; }
  .cal-nav { width: 30px; height: 30px; border-radius: var(--radius); border: 1px solid var(--border2); background: var(--surface2); color: var(--text2); cursor: pointer; font-size: 13px; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
  .cal-nav:hover { background: var(--surface3); color: var(--text); }
  .cal-grid { display: grid; grid-template-columns: repeat(7,1fr); }
  .cal-day-label { padding: 8px 4px; text-align: center; font-size: 10px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; color: var(--text3); border-bottom: 1px solid var(--border); }
  .cal-cell { min-height: 90px; padding: 6px; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); vertical-align: top; position: relative; }
  .cal-cell:nth-child(7n) { border-right: none; }
  .cal-cell.other-month { background: var(--surface2); opacity: 0.55; }
  .cal-cell.today .cal-date { background: var(--accent); color: #fff; border-radius: 50%; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; }
  .cal-date { font-size: 11px; font-weight: 700; color: var(--text2); margin-bottom: 4px; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; }
  .cal-task-chip { font-size: 10px; font-weight: 700; padding: 3px 6px; border-radius: 4px; margin-bottom: 2px; cursor: pointer; overflow: hidden; text-overflow: ellipsis; transition: opacity 0.15s; display: flex; align-items: center; gap: 4px; }
  .cal-task-chip:hover { opacity: 0.8; }
  .cal-task-chip.done-chip { opacity: 0.45; text-decoration: line-through; }
  .cal-more { font-size: 10px; color: var(--text3); font-weight: 700; cursor: pointer; padding: 1px 4px; }
  .cal-more:hover { color: var(--accent); }

  /* ─── ARTICOLI ─── */
  .article-list { display: flex; flex-direction: column; gap: 10px; }
  .article-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; }
  .article-card-header { display: flex; align-items: center; gap: 10px; padding: 12px 14px; cursor: pointer; user-select: none; transition: background 0.15s; }
  .article-card-header:hover { background: var(--surface2); }
  .article-card-title { font-size: 14px; font-weight: 700; color: var(--text); flex: 1; }
  .article-card-meta { font-size: 11px; color: var(--text3); font-family: 'DM Mono', monospace; }
  .article-card-toggle { font-size: 12px; color: var(--text3); transition: transform 0.2s; }
  .article-card-toggle.open { transform: rotate(90deg); }
  .article-card-body { border-top: 1px solid var(--border); padding: 10px; display: flex; flex-direction: column; gap: 5px; }
  .article-task-add { margin: 4px 0 0; padding: 7px; border: 1.5px dashed var(--border2); border-radius: var(--radius); background: none; color: var(--text3); font-size: 12px; font-family: 'Nunito', sans-serif; font-weight: 600; cursor: pointer; text-align: center; transition: all 0.15s; width: 100%; }
  .article-task-add:hover { border-color: var(--accent); color: var(--accent); }
  .article-actions { display: flex; gap: 4px; opacity: 0; transition: opacity 0.15s; }
  .article-card-header:hover .article-actions { opacity: 1; }
  .article-drag-handle { display: flex; align-items: center; justify-content: center; width: 18px; color: var(--text3); cursor: grab; opacity: 0.35; transition: opacity 0.15s; font-size: 12px; flex-shrink: 0; }
  .article-card-header:hover .article-drag-handle { opacity: 0.75; }
  .article-drag-handle:active { cursor: grabbing; opacity: 1; }
  .article-card.dragging { opacity: 0.35; }
  .article-card.drag-over { border: 2px dashed var(--accent); background: var(--accent-dim); }

  /* ─── SYNC STATUS ─── */
  .sync-status { display: flex; align-items: center; gap: 6px; padding: 7px 10px; font-size: 11px; font-weight: 700; border-radius: var(--radius); margin: 0 12px 8px; transition: all 0.3s; }
  .sync-status.ok    { background: rgba(122,158,126,0.12); color: var(--green); }
  .sync-status.saving{ background: rgba(196,144,64,0.12);  color: var(--amber); }
  .sync-status.error { background: rgba(192,97,74,0.12);   color: var(--red); }
  .sync-status.local { background: var(--surface2);        color: var(--text3); }
  .sync-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .sync-status.ok     .sync-dot { background: var(--green); }
  .sync-status.saving .sync-dot { background: var(--amber); animation: pulse 1s infinite; }
  .sync-status.error  .sync-dot { background: var(--red); }
  .sync-status.local  .sync-dot { background: var(--text3); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

  /* Collaboratori sidebar mini */
  .collab-sidebar-list { padding: 0 12px 8px; display: flex; flex-direction: column; gap: 4px; max-height: 120px; overflow-y: auto; }
  .collab-sidebar-item { display: flex; align-items: center; gap: 7px; padding: 5px 8px; border-radius: var(--radius); font-size: 12px; font-weight: 600; color: var(--text2); cursor: pointer; transition: all 0.15s; }
  .collab-sidebar-item:hover { background: var(--surface3); }

  /* Multi-select collaboratori in modal */
  .collab-select-grid { display: flex; flex-wrap: wrap; gap: 6px; }
  .collab-chip-sel { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px 4px 5px; border-radius: 20px; border: 1.5px solid transparent; cursor: pointer; font-size: 11px; font-weight: 700; transition: all 0.15s; user-select: none; }
  .collab-chip-sel.sel { border-color: var(--text) !important; }
</style>
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-header">
    <div class="logo">Project<span>OS</span></div>
    <div class="sidebar-tagline">Il tuo spazio di lavoro</div>
  </div>
  <div class="sidebar-section">
    <div class="sidebar-label">Generale</div>
    <button class="sidebar-nav-item active" onclick="showDashboard()"><i class="fa-regular fa-chart-bar"></i> Dashboard</button>
    <button class="sidebar-nav-item" onclick="showAllTasks()"><i class="fa-regular fa-circle-check"></i> Tutti i task</button>
    <button class="sidebar-nav-item" onclick="showAllNotes()"><i class="fa-regular fa-note-sticky"></i> Tutte le note</button>
    <button class="sidebar-nav-item" onclick="showCalendar()"><i class="fa-regular fa-calendar-days"></i> Calendario</button>
    <button class="sidebar-nav-item" onclick="showCollaborators()"><i class="fa-solid fa-users"></i> Collaboratori</button>
  </div>
  <div class="sidebar-section" style="flex:1;overflow:hidden;display:flex;flex-direction:column;">
    <div class="sidebar-label">Progetti</div>
    <div class="project-list" id="project-list"></div>
    <div style="padding:0 0 6px;">
      <button class="btn-new-project" onclick="openNewProject()"><i class="fa-solid fa-plus" style="font-size:11px;"></i> Nuovo progetto</button>
    </div>
  </div>
  <div id="sync-status" class="sync-status local" style="display:none;">
    <span class="sync-dot"></span><span id="sync-label">Locale</span>
  </div>
  <div class="sidebar-footer">
    <button class="btn-export" onclick="exportData()"><i class="fa-solid fa-file-arrow-down"></i> Esporta</button>
    <button class="btn-import" onclick="triggerImport()"><i class="fa-solid fa-file-arrow-up"></i> Importa</button>
  </div>
</aside>

<input type="file" id="import-input" accept=".json" style="display:none" onchange="importData(event)">

<main class="main">
  <div class="topbar">
    <div class="topbar-title" id="topbar-title">Dashboard</div>
    <div id="topbar-actions" style="display:flex;gap:8px;align-items:center;"></div>
  </div>
  <div id="tab-bar"></div>
  <div class="content" id="main-content"></div>
</main>

<div class="modal-overlay" id="modal-overlay"><div class="modal" id="modal-body"></div></div>
<div class="toast" id="toast"></div>

<script>
const COLORS = ['#c97a5a','#6a90a8','#a89880','#7a9e7e','#9080a8','#6aa8a0','#c49040','#b07888','#7a8ea0'];
const COLLAB_COLORS = ['#e07a5f','#3d405b','#81b29a','#f2cc8f','#8ecae6','#c77dff','#52b788','#f4a261','#457b9d','#e76f51','#2a9d8f','#e9c46a'];

let state = {
  projects:[], tasks:[], notes:[],
  collaborators:[], articles:[],
  currentProject:null, currentTab:'kanban', currentView:'dashboard',
  calYear: new Date().getFullYear(), calMonth: new Date().getMonth()
};

// ══════════════════════════════════════════════════════════════
// ★ CONFIGURAZIONE GOOGLE DRIVE SYNC
// Incolla qui l'URL del tuo Google Apps Script dopo averlo pubblicato.
// Lascia '' per usare solo il salvataggio locale (localStorage).
// ══════════════════════════════════════════════════════════════
const SCRIPT_URL = '';  // es: 'https://script.google.com/macros/s/XXXXXXXX/exec'

// ─── SYNC HELPERS ─────────────────────────────────────────────
let _saveTimer = null;
let _syncEnabled = false;

function setSyncStatus(type, label) {
  const el = document.getElementById('sync-status');
  const lb = document.getElementById('sync-label');
  if(!el || !lb) return;
  el.className = 'sync-status ' + type;
  el.style.display = 'flex';
  lb.textContent = label;
}

function save() {
  // Salva sempre in localStorage come backup immediato
  localStorage.setItem('projectos_v4', JSON.stringify(state));
  // Se lo script è configurato, sincronizza sul Drive
  if(SCRIPT_URL) {
    setSyncStatus('saving', 'Salvataggio…');
    clearTimeout(_saveTimer);
    _saveTimer = setTimeout(()=>syncToCloud(), 800); // debounce 800ms
  }
}

function syncToCloud() {
  if(!SCRIPT_URL) return;
  const payload = JSON.stringify({action:'save', data: JSON.stringify(state)});
  fetch(SCRIPT_URL, { method:'POST', body: payload })
    .then(r => r.json())
    .then(res => {
      if(res.ok) setSyncStatus('ok', 'Sincronizzato ✓');
      else        setSyncStatus('error', 'Errore sync');
    })
    .catch(()=> setSyncStatus('error', 'Offline — salvato in locale'));
}

function load() {
  if(SCRIPT_URL) {
    // Carica dal cloud, con fallback su localStorage
    setSyncStatus('saving', 'Caricamento…');
    fetch(SCRIPT_URL + '?action=load')
      .then(r => r.json())
      .then(res => {
        if(res.ok && res.data) {
          try {
            const remote = JSON.parse(res.data);
            state = {...state, ...remote};
            _postLoad();
            setSyncStatus('ok', 'Drive connesso ✓');
          } catch(e) { _loadLocal(); }
        } else { _loadLocal(); }
      })
      .catch(()=>{
        _loadLocal();
        setSyncStatus('error', 'Offline — dati locali');
      });
  } else {
    _loadLocal();
  }
}

function _loadLocal() {
  try {
    const d = localStorage.getItem('projectos_v4');
    if(d) { const s=JSON.parse(d); state={...state,...s}; }
    else {
      const d3=localStorage.getItem('projectos_v3');
      if(d3){ const s3=JSON.parse(d3); state.projects=s3.projects||[]; state.tasks=s3.tasks||[]; state.notes=s3.notes||[]; state.collaborators=s3.collaborators||[]; }
      else {
        const d2=localStorage.getItem('projectos_v2');
        if(d2){ const s2=JSON.parse(d2); state.projects=s2.projects||[]; state.tasks=s2.tasks||[]; state.notes=s2.notes||[]; }
      }
    }
  } catch(e){}
  _postLoad();
  if(!SCRIPT_URL) setSyncStatus('local', 'Solo locale');
}

function _postLoad() {
  if(!state.collaborators) state.collaborators=[];
  if(!state.articles) state.articles=[];
  if(!state.kanbanSort) state.kanbanSort={};
  state.tasks.forEach(t=>{
    if(t.done && t.status!=='done') t.status='done';
    else if(!t.done && t.status==='done') t.status='todo';
    if(!t.status) t.status='todo';
  });
  // Render dopo il caricamento (serve per load asincrono da cloud)
  renderSidebar();
  showDashboard();
}

// ─── EXPORT / IMPORT ───────────────────────────────────────────
function exportData() {
  const blob = new Blob([JSON.stringify({version:3,exported:new Date().toISOString(),...state},null,2)],{type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'projectos_'+new Date().toISOString().slice(0,10)+'.json';
  a.click(); URL.revokeObjectURL(a.href); showToast('✓ Dati esportati correttamente');
}
function triggerImport() { document.getElementById('import-input').click(); }
function importData(e) {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    try {
      const data = JSON.parse(ev.target.result);
      if (!data.projects||!data.tasks||!data.notes) throw new Error('Formato non valido');
      const merge = confirm('Vuoi UNIRE i dati importati a quelli esistenti?\n\nOK = Unisci   |   Annulla = Sostituisci tutto');
      if (merge) {
        const ep=new Set(state.projects.map(p=>p.id)), et=new Set(state.tasks.map(t=>t.id)), en=new Set(state.notes.map(n=>n.id)), ec=new Set(state.collaborators.map(c=>c.id)), ea=new Set(state.articles.map(a=>a.id));
        data.projects.forEach(p=>{if(!ep.has(p.id))state.projects.push(p);});
        data.tasks.forEach(t=>{if(!et.has(t.id))state.tasks.push(t);});
        data.notes.forEach(n=>{if(!en.has(n.id))state.notes.push(n);});
        (data.collaborators||[]).forEach(c=>{if(!ec.has(c.id))state.collaborators.push(c);});
        (data.articles||[]).forEach(a=>{if(!ea.has(a.id))state.articles.push(a);});
        showToast('✓ Dati uniti correttamente');
      } else {
        state.projects=data.projects; state.tasks=data.tasks; state.notes=data.notes;
        state.collaborators=data.collaborators||[];
        state.articles=data.articles||[];
        state.currentProject=null; state.currentView='dashboard';
        showToast('✓ Dati importati correttamente');
      }
      save(); renderSidebar(); showDashboard();
    } catch(err) { alert('Errore: il file non è un backup valido.\n'+err.message); }
    e.target.value='';
  };
  reader.readAsText(file);
}
function showToast(msg) {
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2800);
}

// ─── UTILS ─────────────────────────────────────────────────────
function uid() { return Date.now().toString(36)+Math.random().toString(36).slice(2); }
function today() { return new Date().toISOString().slice(0,10); }
function fmt(d) { return d?new Date(d+'T12:00:00').toLocaleDateString('it-IT',{day:'2-digit',month:'short'}):''; }
function isOverdue(d) { return d?new Date(d+'T23:59:59')<new Date():false; }
function projectTasks(pid) { return state.tasks.filter(t=>t.project===pid); }
function projectNotes(pid) { return state.notes.filter(n=>n.project===pid); }
function projectArticles(pid) { return state.articles.filter(a=>a.project===pid); }
function articleTasks(aid) { return state.tasks.filter(t=>t.article===aid); }
function progress(pid) { const t=projectTasks(pid); return t.length?Math.round(t.filter(x=>x.done).length/t.length*100):0; }
function getCollab(id) { return state.collaborators.find(c=>c.id===id); }
function collabInitials(c) { if(!c)return'?'; return c.name.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2); }
function collabColor(c) { return c?c.color:'#aaa'; }

function avatarHtml(collabId, large=false) {
  const c=getCollab(collabId);
  if(!c)return'';
  const cls=large?'collab-avatar collab-avatar-lg':'collab-avatar';
  return `<span class="${cls}" style="background:${c.color}" title="${c.name}">${collabInitials(c)}</span>`;
}

function collabBadgeHtml(collabId) {
  const c=getCollab(collabId);
  if(!c)return'';
  const bg=c.color+'22'; const col=c.color;
  return `<span class="collab-badge" style="background:${bg};color:${col}">${avatarHtml(collabId)}<span>${c.name.split(' ')[0]}</span></span>`;
}

// ─── MODAL ────────────────────────────────────────────────────
function openModal(html) { document.getElementById('modal-body').innerHTML=html; document.getElementById('modal-overlay').classList.add('show'); }
function closeModal() { document.getElementById('modal-overlay').classList.remove('show'); }
document.getElementById('modal-overlay').addEventListener('click',function(e){if(e.target===this)closeModal();});

// ─── PROJECTS ─────────────────────────────────────────────────
function openNewProject() {
  openModal(`<div class="modal-title">Nuovo progetto</div>
    <div class="form-group"><label class="form-label">Nome</label><input class="form-input" id="p-name" placeholder="Es. Sito web cliente" autofocus></div>
    <div class="form-group"><label class="form-label">Descrizione (opzionale)</label><textarea class="form-textarea" id="p-desc" style="min-height:65px;" placeholder="Descrizione breve..."></textarea></div>
    <div class="form-group"><label class="form-label">Colore</label>
      <div class="color-picker">${COLORS.map((c,i)=>`<div class="color-opt${i===0?' selected':''}" style="background:${c}" data-c="${c}" onclick="selectColor(this)"></div>`).join('')}</div></div>
    <div class="modal-actions"><button class="btn" onclick="closeModal()">Annulla</button><button class="btn btn-primary" onclick="createProject()">Crea progetto</button></div>`);
}
function selectColor(el) { document.querySelectorAll('.color-opt').forEach(e=>e.classList.remove('selected')); el.classList.add('selected'); }
function createProject() {
  const name=document.getElementById('p-name').value.trim(); if(!name) return;
  const color=document.querySelector('.color-opt.selected')?.dataset.c||COLORS[0];
  state.projects.push({id:uid(),name,desc:document.getElementById('p-desc').value.trim(),color,created:today()});
  save(); closeModal(); renderSidebar(); openProject(state.projects[state.projects.length-1].id);
}
function openProject(id) { state.currentProject=id; state.currentView='project'; state.currentTab='kanban'; document.querySelectorAll('.sidebar-nav-item').forEach(e=>e.classList.remove('active')); renderSidebar(); renderProject(); }
function deleteProject(id) {
  if(!confirm('Eliminare il progetto e tutti i suoi dati?')) return;
  state.projects=state.projects.filter(p=>p.id!==id); state.tasks=state.tasks.filter(t=>t.project!==id); state.notes=state.notes.filter(n=>n.project!==id); state.articles=state.articles.filter(a=>a.project!==id);
  if(state.currentProject===id){state.currentProject=null;state.currentView='dashboard';}
  save(); renderSidebar(); showDashboard();
}
function editProject(id) {
  const p=state.projects.find(x=>x.id===id); if(!p) return;
  openModal(`<div class="modal-title">Modifica progetto</div>
    <div class="form-group"><label class="form-label">Nome</label><input class="form-input" id="p-name" value="${p.name}" autofocus></div>
    <div class="form-group"><label class="form-label">Descrizione</label><textarea class="form-textarea" id="p-desc" style="min-height:65px;">${p.desc||''}</textarea></div>
    <div class="form-group"><label class="form-label">Colore</label>
      <div class="color-picker">${COLORS.map(c=>`<div class="color-opt${c===p.color?' selected':''}" style="background:${c}" data-c="${c}" onclick="selectColor(this)"></div>`).join('')}</div></div>
    <div class="modal-actions"><button class="btn" onclick="closeModal()">Annulla</button><button class="btn btn-primary" onclick="saveProject('${id}')">Salva</button></div>`);
}
function saveProject(id) {
  const p=state.projects.find(x=>x.id===id); if(!p) return;
  p.name=document.getElementById('p-name').value.trim()||p.name;
  p.desc=document.getElementById('p-desc').value.trim();
  p.color=document.querySelector('.color-opt.selected')?.dataset.c||p.color;
  save(); closeModal(); renderSidebar(); renderProject();
}

// ─── SIDEBAR ──────────────────────────────────────────────────
function renderSidebar() {
  const list=document.getElementById('project-list');
  if(!state.projects.length){list.innerHTML='<div style="font-size:12px;color:var(--text3);padding:8px 10px;">Nessun progetto ancora</div>';return;}
  list.innerHTML=state.projects.map(p=>`
    <div class="project-item${state.currentProject===p.id?' active':''}" onclick="openProject('${p.id}')">
      <div class="project-dot" style="background:${p.color}"></div>
      <span class="project-name">${p.name}</span>
      <span class="project-count">${projectTasks(p.id).length}</span>
      <button class="project-del" onclick="event.stopPropagation();deleteProject('${p.id}')"><i class="fa-solid fa-xmark"></i></button>
    </div>`).join('');
}

// ─── DASHBOARD ────────────────────────────────────────────────
function showDashboard() {
  state.currentView='dashboard'; state.currentProject=null;
  document.querySelectorAll('.sidebar-nav-item').forEach((e,i)=>i===0?e.classList.add('active'):e.classList.remove('active'));
  renderSidebar();
  document.getElementById('topbar-title').innerHTML='Dashboard';
  document.getElementById('topbar-actions').innerHTML=`<button class="btn" onclick="showExportSheetsModal()" style="color:var(--green);border-color:rgba(122,158,126,0.4);"><i class="fa-solid fa-table"></i> Sincronizza Sheets</button>`;
  document.getElementById('tab-bar').innerHTML='';
  const done=state.tasks.filter(t=>t.done).length;
  const overdue=state.tasks.filter(t=>!t.done&&isOverdue(t.due)).length;
  document.getElementById('main-content').innerHTML=`
    <div class="stats-grid">
      <div class="stat-card" style="border-left:3px solid var(--accent)"><div class="stat-label">Progetti</div><div class="stat-value">${state.projects.length} <small>attivi</small></div></div>
      <div class="stat-card" style="border-left:3px solid var(--blue)"><div class="stat-label">Task completati</div><div class="stat-value">${done}<small>/${state.tasks.length}</small></div></div>
      <div class="stat-card" style="border-left:3px solid ${overdue?'var(--red)':'var(--green)'}"><div class="stat-label">Scaduti</div><div class="stat-value" style="color:${overdue?'var(--red)':'var(--text)'}">${overdue}</div></div>
      <div class="stat-card" style="border-left:3px solid var(--purple)"><div class="stat-label">Collaboratori</div><div class="stat-value">${state.collaborators.length}</div></div>
    </div>
    ${state.projects.length?`
    <div class="section-title">Panoramica progetti</div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-bottom:24px;">
      ${state.projects.map(p=>{const pt=projectTasks(p.id),pct=progress(p.id);
        const assignedCollabs=[...new Set(pt.map(t=>t.assignee).filter(Boolean))];
        return`
        <div class="stat-card" style="cursor:pointer;border-left:3px solid ${p.color};" onclick="openProject('${p.id}')">
          <div style="display:flex;align-items:center;gap:7px;margin-bottom:8px;"><div style="width:9px;height:9px;border-radius:50%;background:${p.color}"></div><span style="font-size:14px;font-weight:700;">${p.name}</span></div>
          ${p.desc?`<div style="font-size:12px;color:var(--text2);margin-bottom:8px;line-height:1.5;">${p.desc}</div>`:''}
          <div style="display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--text3);">
            <span>${pt.filter(t=>!t.done).length} task aperti</span>
            <div style="display:flex;gap:-4px;">${assignedCollabs.slice(0,4).map(cid=>avatarHtml(cid)).join('')}</div>
          </div>
          <div style="text-align:right;font-size:10px;font-family:'DM Mono',monospace;margin-top:2px;">${pct}%</div>
          <div class="progress-bar-track"><div class="progress-bar-fill" style="width:${pct}%;background:${p.color}"></div></div>
        </div>`;}).join('')}
    </div>`:
    `<div class="empty-state"><i class="fa-regular fa-folder-open"></i><p>Non hai ancora progetti. Creane uno dalla barra laterale!</p><button class="btn btn-primary" onclick="openNewProject()"><i class="fa-solid fa-plus"></i> Crea il primo progetto</button></div>`}
    ${overdue?`<div class="section-title" style="color:var(--red);margin-top:8px;"><i class="fa-solid fa-triangle-exclamation" style="margin-right:5px"></i>Task scaduti</div><div class="task-list">${state.tasks.filter(t=>!t.done&&isOverdue(t.due)).map(t=>renderTaskItem(t,true)).join('')}</div>`:''}
    <div class="info-box" style="margin-top:24px;">
      <i class="fa-solid fa-arrows-rotate"></i>
      <div>
        <div class="info-box-title">Condivisione con i collaboratori</div>
        <div class="info-box-body">Usa <strong>Esporta</strong> per salvare un file JSON con tutti i tuoi dati, poi condividilo via AirDrop, email o Drive. Chi riceve il file usa <strong>Importa</strong> e sceglie se unire o sostituire i propri dati.</div>
      </div>
    </div>`;
}

// ─── ALL TASKS ────────────────────────────────────────────────
function showAllTasks() {
  state.currentView='alltasks'; state.currentProject=null;
  document.querySelectorAll('.sidebar-nav-item').forEach((e,i)=>i===1?e.classList.add('active'):e.classList.remove('active'));
  renderSidebar();
  document.getElementById('topbar-title').innerHTML='Tutti i task';
  document.getElementById('topbar-actions').innerHTML=`<button class="btn btn-primary" onclick="openNewTask(null)"><i class="fa-solid fa-plus"></i> Nuovo task</button>`;
  document.getElementById('tab-bar').innerHTML='';
  const tasks=[...state.tasks].sort((a,b)=>{
    if(!a.done&&b.done)return -1;if(a.done&&!b.done)return 1;
    if(a.due&&b.due)return b.due.localeCompare(a.due);
    if(a.due&&!b.due)return -1;if(!a.due&&b.due)return 1;
    return b.created.localeCompare(a.created);
  });
  document.getElementById('main-content').innerHTML=tasks.length?`<div class="task-list">${tasks.map(t=>renderTaskItem(t,true)).join('')}</div>`:emptyState('fa-circle-check','Nessun task ancora. Aprì un progetto e aggiungine uno!');
}

// ─── ALL NOTES ────────────────────────────────────────────────
function showAllNotes() {
  state.currentView='allnotes'; state.currentProject=null;
  document.querySelectorAll('.sidebar-nav-item').forEach((e,i)=>i===2?e.classList.add('active'):e.classList.remove('active'));
  renderSidebar();
  document.getElementById('topbar-title').innerHTML='Tutte le note';
  document.getElementById('topbar-actions').innerHTML=`<button class="btn btn-primary" onclick="openNewNote(null)"><i class="fa-solid fa-plus"></i> Nuova nota</button>`;
  document.getElementById('tab-bar').innerHTML='';
  renderNotesContent(state.notes);
}

// ─── PROJECT ─────────────────────────────────────────────────
function renderProject() {
  const p=state.projects.find(x=>x.id===state.currentProject); if(!p) return showDashboard();
  document.getElementById('topbar-title').innerHTML=`<span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${p.color};margin-right:8px;vertical-align:middle;"></span>${p.name}<span>${progress(p.id)}% completato</span>`;
  document.getElementById('topbar-actions').innerHTML=`<button class="btn" onclick="showExportSheetsModal()" style="color:var(--green);border-color:rgba(122,158,126,0.4);"><i class="fa-solid fa-table"></i> Sheets</button><button class="btn" onclick="editProject('${p.id}')"><i class="fa-regular fa-pen-to-square"></i> Modifica</button>`;
  const _artCount=projectArticles(state.currentProject).length;
  document.getElementById('tab-bar').innerHTML=`<div class="tabs">
    <div class="tab${state.currentTab==='kanban'?' active':''}" onclick="switchTab('kanban')"><i class="fa-solid fa-table-columns"></i> Kanban</div>
    <div class="tab${state.currentTab==='tasks'?' active':''}" onclick="switchTab('tasks')"><i class="fa-regular fa-circle-check"></i> Task</div>
    <div class="tab${state.currentTab==='articles'?' active':''}" onclick="switchTab('articles')"><i class="fa-regular fa-file-lines"></i> Articoli${_artCount?` <span style="background:var(--accent-dim);color:var(--accent);font-size:10px;padding:1px 7px;border-radius:10px;font-family:'DM Mono',monospace;margin-left:2px;">${_artCount}</span>`:''}</div>
    <div class="tab${state.currentTab==='notes'?' active':''}" onclick="switchTab('notes')"><i class="fa-regular fa-note-sticky"></i> Note</div>
  </div>`;
  renderTab();
}
function switchTab(tab){state.currentTab=tab;renderProject();}
function renderTab(){if(state.currentTab==='kanban')renderKanban();else if(state.currentTab==='tasks')renderTasks();else if(state.currentTab==='articles')renderArticles();else renderNotes();}

// ─── KANBAN ───────────────────────────────────────────────────
const COLS=[{id:'todo',label:'Da fare',color:'var(--text3)'},{id:'inprogress',label:'In corso',color:'var(--blue)'},{id:'done',label:'Fatto',color:'var(--green)'}];

function toggleKanbanSort(colId) {
  if(!state.kanbanSort) state.kanbanSort={};
  state.kanbanSort[colId] = state.kanbanSort[colId]==='asc' ? 'desc' : 'asc';
  renderKanban();
}

function sortTasks(tasks, colId) {
  if(!state.kanbanSort) state.kanbanSort={};
  const dir = state.kanbanSort[colId] ?? (colId==='todo' ? 'asc' : 'desc'); // default decrescente
  return [...tasks].sort((a,b)=>{
    if(a.due&&b.due) return dir==='desc' ? b.due.localeCompare(a.due) : a.due.localeCompare(b.due);
    if(a.due&&!b.due) return -1;
    if(!a.due&&b.due) return 1;
    return dir==='desc' ? b.created.localeCompare(a.created) : a.created.localeCompare(b.created);
  });
}

function renderKanban() {
  if(!state.kanbanSort) state.kanbanSort={};
  const tasks=projectTasks(state.currentProject);
  document.getElementById('main-content').innerHTML=`<div class="kanban-board">${COLS.map(col=>{
    const dir = state.kanbanSort[col.id] ?? (col.id==='todo' ? 'asc' : 'desc');
    const ct=sortTasks(tasks.filter(t=>(t.status||'todo')===col.id), col.id);
    return`<div class="kanban-col">
      <div class="kanban-col-header" style="color:${col.color}">
        <span style="width:7px;height:7px;border-radius:50%;background:${col.color};display:inline-block;"></span>
        ${col.label}
        <span class="kanban-col-count">${ct.length}</span>
        <button onclick="toggleKanbanSort('${col.id}')" title="${dir==='desc'?'Ordine decrescente (clicca per crescente)':'Ordine crescente (clicca per decrescente)'}"
          style="margin-left:auto;border:none;background:none;cursor:pointer;color:${col.color};opacity:0.7;font-size:11px;padding:2px 4px;border-radius:4px;display:flex;align-items:center;gap:3px;font-family:'DM Mono',monospace;font-weight:700;transition:opacity .15s;"
          onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=0.7">
          <i class="fa-solid fa-arrow-${dir==='desc'?'down':'up'}-wide-short"></i>
        </button>
      </div>
      <div class="kanban-cards">${ct.map(t=>{
        const c=getCollab(t.assignee);
        const cardBg = c ? c.color+'11' : '';
        const cardBorder = c ? c.color+'55' : '';
        return`<div class="kanban-card" onclick="editTask('${t.id}')" style="${c?`background:${cardBg};border-color:${cardBorder};`:''}">
          <div style="position:absolute;left:0;top:0;bottom:0;width:3px;background:${c?c.color:getPriCol(t.priority)};border-radius:2px 0 0 2px;"></div>
          <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:6px;margin-bottom:6px;">
            <div class="kanban-card-title" style="margin-bottom:0;">${t.title}</div>
            ${c?avatarHtml(t.assignee):''}
          </div>
          <div class="kanban-card-meta">${(()=>{const ar=t.article?state.articles.find(x=>x.id===t.article):null;return ar?`<span style="display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:700;color:var(--teal);padding:1px 0;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"><i class="fa-regular fa-file-lines" style="font-size:9px;flex-shrink:0;"></i>${ar.title}</span>`:''})()}${t.due?`<span class="task-due${isOverdue(t.due)&&!t.done?' overdue':''}"><i class="fa-regular fa-calendar" style="margin-right:3px"></i>${fmt(t.due)}</span>`:''}${t.priority?`<span class="tag" style="background:${getPriBg(t.priority)};color:${getPriCol(t.priority)}">${t.priority}</span>`:''}</div>
        </div>`;}).join('')}</div>
      <button class="kanban-add" onclick="openNewTask('${state.currentProject}','${col.id}')">+ Aggiungi task</button>
    </div>`;}).join('')}</div>`;
}
function getPriCol(p){return p==='alta'?'var(--red)':p==='media'?'var(--amber)':'var(--blue)';}
function getPriBg(p){return p==='alta'?'rgba(192,97,74,0.12)':p==='media'?'rgba(196,144,64,0.12)':'rgba(106,144,168,0.12)';}

// ─── TASKS ────────────────────────────────────────────────────
function renderTasks() {
  const tasks=projectTasks(state.currentProject);
  document.getElementById('topbar-actions').innerHTML+=`<button class="btn btn-primary" style="margin-left:6px;" onclick="openNewTask('${state.currentProject}')"><i class="fa-solid fa-plus"></i> Task</button>`;
  const sorted=[...tasks].sort((a,b)=>{
    if(!a.done&&b.done)return -1;if(a.done&&!b.done)return 1;
    // data decrescente (più recenti prima); task senza data in fondo
    if(a.due&&b.due)return b.due.localeCompare(a.due);
    if(a.due&&!b.due)return -1;if(!a.due&&b.due)return 1;
    return b.created.localeCompare(a.created);
  });
  document.getElementById('main-content').innerHTML=sorted.length?`<div class="task-list">${sorted.map(t=>renderTaskItem(t)).join('')}</div>`:emptyState('fa-circle-check','Nessun task ancora!');
}

function renderTaskItem(t,showProject=false){
  const p=state.projects.find(x=>x.id===t.project);
  const a=t.article?state.articles.find(x=>x.id===t.article):null;
  const c=getCollab(t.assignee);
  const leftColor = c ? c.color : (t.priority?getPriCol(t.priority):'var(--border2)');
  return`<div class="task-item" style="border-left:3px solid ${leftColor};">
    <div class="task-check${t.done?' done':''}" onclick="toggleTask('${t.id}')"></div>
    <div class="task-body" onclick="editTask('${t.id}')">
      <div class="task-title${t.done?' done':''}">${t.title}</div>
      <div class="task-meta">
        ${showProject&&p?`<span style="display:inline-flex;align-items:center;gap:4px;"><span style="width:6px;height:6px;border-radius:50%;background:${p.color}"></span>${p.name}</span>`:''}
        ${a?`<span style="display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;color:var(--text2);background:var(--surface2);padding:1px 6px;border-radius:4px;"><i class="fa-regular fa-file-lines" style="font-size:9px;"></i>${a.title}</span>`:''}
        ${t.due?`<span class="task-due${isOverdue(t.due)&&!t.done?' overdue':''}"><i class="fa-regular fa-calendar" style="margin-right:3px"></i>${fmt(t.due)}</span>`:''}
        ${t.priority?`<span class="tag" style="background:${getPriBg(t.priority)};color:${getPriCol(t.priority)}">${t.priority}</span>`:''}
        ${t.status&&!t.done?`<span class="tag" style="background:rgba(106,144,168,0.12);color:var(--blue)">${t.status==='inprogress'?'in corso':'da fare'}</span>`:''}
        ${c?collabBadgeHtml(t.assignee):''}
      </div>
    </div>
    <div class="task-actions"><button class="icon-btn danger" onclick="deleteTask('${t.id}')"><i class="fa-regular fa-trash-can"></i></button></div>
  </div>`;
}
function toggleTask(id){
  const t=state.tasks.find(x=>x.id===id);
  if(t){
    if(t.status==='done'){ t.status='todo'; t.done=false; }
    else { t.status='done'; t.done=true; }
    save();refreshCurrent();
  }
}
function deleteTask(id){state.tasks=state.tasks.filter(t=>t.id!==id);save();refreshCurrent();}

// ─── ARTICLES ─────────────────────────────────────────────────
function renderArticles() {
  const articles=projectArticles(state.currentProject);
  // Aggiorna tab con contatore
  document.querySelectorAll('.tab').forEach(tab=>{
    if(tab.textContent.trim().startsWith('Articoli')||tab.innerHTML.includes('fa-file-lines')){
      tab.innerHTML=`<i class="fa-regular fa-file-lines"></i> Articoli <span style="background:var(--accent-dim);color:var(--accent);font-size:10px;padding:1px 7px;border-radius:10px;font-family:'DM Mono',monospace;margin-left:2px;">${articles.length}</span>`;
    }
  });
  document.getElementById('topbar-actions').innerHTML+=`<button class="btn btn-primary" style="margin-left:6px;" onclick="openNewArticle('${state.currentProject}')"><i class="fa-solid fa-plus"></i> Articolo</button>`;
  if(!articles.length){
    document.getElementById('main-content').innerHTML=emptyState('fa-file-lines','Nessun articolo ancora!','openNewArticleFromEmpty');
    window.openNewArticleFromEmpty=()=>openNewArticle(state.currentProject);
    return;
  }
  const html=`<div class="article-list" id="article-list-el">${articles.map(a=>{
    const tasks=articleTasks(a.id);
    const done=tasks.filter(t=>t.done).length;
    const pct=tasks.length?Math.round(done/tasks.length*100):0;
    const p=state.projects.find(x=>x.id===a.project);
    const color=p?p.color:'var(--accent)';
    return`<div class="article-card" id="art-${a.id}" draggable="true" data-id="${a.id}">
      <div class="article-card-header" onclick="toggleArticle('${a.id}')">
        <span class="article-drag-handle" onclick="event.stopPropagation()" title="Trascina per riordinare"><i class="fa-solid fa-grip-vertical"></i></span>
        <i class="fa-solid fa-chevron-right article-card-toggle" id="art-tog-${a.id}"></i>
        <div style="width:8px;height:8px;border-radius:50%;background:${color};flex-shrink:0;"></div>
        <div class="article-card-title">${a.title}</div>
        ${a.desc?`<div class="article-card-meta" style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${a.desc}</div>`:''}
        <div class="article-card-meta">${tasks.length} task · ${pct}%</div>
        <div class="article-actions" onclick="event.stopPropagation()">
          <button class="icon-btn" onclick="duplicateArticle('${a.id}')" title="Duplica articolo con tutti i task"><i class="fa-regular fa-copy"></i></button>
          <button class="icon-btn" onclick="editArticle('${a.id}')" title="Modifica"><i class="fa-regular fa-pen-to-square"></i></button>
          <button class="icon-btn danger" onclick="deleteArticle('${a.id}')" title="Elimina"><i class="fa-regular fa-trash-can"></i></button>
        </div>
      </div>
      <div class="article-card-body" id="art-body-${a.id}" style="display:none;">
        ${tasks.length?`<div class="task-list" style="gap:4px;">${tasks.map(t=>renderTaskItem(t)).join('')}</div>`:'<div style="font-size:12px;color:var(--text3);padding:4px 6px;">Nessun task ancora per questo articolo.</div>'}
        <button class="article-task-add" onclick="openNewTask('${state.currentProject}','todo','${a.id}')"><i class="fa-solid fa-plus" style="margin-right:4px;"></i>Aggiungi task</button>
      </div>
    </div>`;
  }).join('')}
  <button class="btn-new-project" style="margin-top:4px;" onclick="openNewArticle('${state.currentProject}')"><i class="fa-solid fa-plus" style="font-size:11px;"></i> Nuovo articolo</button>
  </div>`;
  document.getElementById('main-content').innerHTML=html;
  initArticleDrag();
}

function toggleArticle(id) {
  const body=document.getElementById('art-body-'+id);
  const tog=document.getElementById('art-tog-'+id);
  if(!body||!tog)return;
  const open=body.style.display==='none';
  body.style.display=open?'flex':'none';
  body.style.flexDirection='column';
  if(open)tog.classList.add('open');else tog.classList.remove('open');
}

function initArticleDrag() {
  const list = document.getElementById('article-list-el');
  if(!list) return;
  let dragSrc = null;

  list.querySelectorAll('.article-card[draggable="true"]').forEach(card => {
    card.addEventListener('dragstart', e => {
      dragSrc = card;
      card.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', card.dataset.id);
    });
    card.addEventListener('dragend', () => {
      card.classList.remove('dragging');
      list.querySelectorAll('.article-card').forEach(c => c.classList.remove('drag-over'));
      // Salva nuovo ordine in state.articles
      const newOrder = [...list.querySelectorAll('.article-card[data-id]')].map(el => el.dataset.id);
      const pid = state.currentProject;
      const others = state.articles.filter(a => a.project !== pid);
      const reordered = newOrder.map(id => state.articles.find(a => a.id === id)).filter(Boolean);
      state.articles = [...others, ...reordered];
      save();
    });
    card.addEventListener('dragover', e => {
      e.preventDefault();
      if(card === dragSrc) return;
      list.querySelectorAll('.article-card').forEach(c => c.classList.remove('drag-over'));
      card.classList.add('drag-over');
    });
    card.addEventListener('dragleave', () => card.classList.remove('drag-over'));
    card.addEventListener('drop', e => {
      e.preventDefault();
      if(card === dragSrc) return;
      card.classList.remove('drag-over');
      // Inserisci dragSrc prima o dopo card in base alla posizione verticale
      const rect = card.getBoundingClientRect();
      const mid = rect.top + rect.height / 2;
      if(e.clientY < mid) {
        list.insertBefore(dragSrc, card);
      } else {
        list.insertBefore(dragSrc, card.nextSibling);
      }
    });
  });
}

function openNewArticle(projectId) {
  openModal(`<div class="modal-title">Nuovo articolo</div>
    <div class="form-group"><label class="form-label">Titolo</label><input class="form-input" id="a-title" placeholder="Es. Introduzione, Capitolo 1..." autofocus></div>
    <div class="form-group"><label class="form-label">Descrizione (opzionale)</label><input class="form-input" id="a-desc" placeholder="Breve descrizione..."></div>
    <div class="modal-actions"><button class="btn" onclick="closeModal()">Annulla</button><button class="btn btn-primary" onclick="createArticle('${projectId}')">Crea articolo</button></div>`);
}

function createArticle(projectId) {
  const title=document.getElementById('a-title').value.trim(); if(!title)return;
  state.articles.push({id:uid(),title,desc:document.getElementById('a-desc').value.trim(),project:projectId,created:today()});
  save();closeModal();refreshCurrent();
}

function editArticle(id) {
  const a=state.articles.find(x=>x.id===id); if(!a)return;
  openModal(`<div class="modal-title">Modifica articolo</div>
    <div class="form-group"><label class="form-label">Titolo</label><input class="form-input" id="a-title" value="${a.title}" autofocus></div>
    <div class="form-group"><label class="form-label">Descrizione</label><input class="form-input" id="a-desc" value="${a.desc||''}"></div>
    <div class="modal-actions">
      <button class="btn" style="color:var(--red);border-color:rgba(192,97,74,0.25)" onclick="deleteArticle('${a.id}');closeModal()"><i class="fa-regular fa-trash-can"></i></button>
      <button class="btn" onclick="closeModal()">Annulla</button>
      <button class="btn btn-primary" onclick="saveArticle('${id}')">Salva</button>
    </div>`);
}

function saveArticle(id) {
  const a=state.articles.find(x=>x.id===id); if(!a)return;
  a.title=document.getElementById('a-title').value.trim()||a.title;
  a.desc=document.getElementById('a-desc').value.trim();
  save();closeModal();refreshCurrent();
}

function deleteArticle(id) {
  if(!confirm('Eliminare l\'articolo? I task associati rimarranno ma perderanno il collegamento.'))return;
  state.tasks.forEach(t=>{if(t.article===id)t.article=null;});
  state.articles=state.articles.filter(a=>a.id!==id);
  save();refreshCurrent();
}

// ─── TASK MODAL ───────────────────────────────────────────────
function collabSelectHtml(selectedId='') {
  if(!state.collaborators.length) return `<div style="font-size:12px;color:var(--text3);padding:4px 0;">Nessun collaboratore. <a href="#" onclick="closeModal();showCollaborators();return false;" style="color:var(--accent);">Aggiungine uno →</a></div>`;
  return `<div class="collab-select-grid" id="collab-sel-grid">
    <div class="collab-chip-sel${!selectedId?' sel':''}" style="background:var(--surface2);color:var(--text2);" data-cid="" onclick="selCollab(this)">
      <span class="collab-avatar" style="background:var(--text3);font-size:9px;">—</span>
      <span style="font-size:11px;font-weight:700;">Nessuno</span>
    </div>
    ${state.collaborators.map(c=>`
      <div class="collab-chip-sel${c.id===selectedId?' sel':''}" style="background:${c.color}18;color:${c.color};border-color:${c.id===selectedId?c.color:'transparent'};" data-cid="${c.id}" onclick="selCollab(this)">
        ${avatarHtml(c.id)}<span>${c.name.split(' ')[0]}</span>
      </div>`).join('')}
  </div>`;
}
function selCollab(el) {
  document.querySelectorAll('#collab-sel-grid .collab-chip-sel').forEach(e=>e.classList.remove('sel'));
  el.classList.add('sel');
}
function getSelectedCollab() {
  const el=document.querySelector('#collab-sel-grid .collab-chip-sel.sel');
  return el?el.dataset.cid:'';
}

function openNewTask(projectId,status='todo',articleId=''){
  const pOpts=state.projects.map(pr=>`<option value="${pr.id}"${pr.id===projectId?' selected':''}>${pr.name}</option>`).join('');
  const pid=projectId||state.currentProject;
  const artOpts=pid?state.articles.filter(a=>a.project===pid).map(a=>`<option value="${a.id}"${a.id===articleId?' selected':''}>${a.title}</option>`).join(''):'';
  const artSel=artOpts?`<div class="form-group"><label class="form-label">Articolo</label><select class="form-select" id="t-article"><option value="">— Nessuno —</option>${artOpts}</select></div>`:'';
  openModal(`<div class="modal-title">Nuovo task</div>
    <div class="form-group"><label class="form-label">Titolo</label><input class="form-input" id="t-title" placeholder="Descrivi il task..." autofocus></div>
    <div class="form-group"><label class="form-label">Progetto</label><select class="form-select" id="t-project">${pOpts}</select></div>
    ${artSel}
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
      <div class="form-group"><label class="form-label">Scadenza</label><input class="form-input" id="t-due" type="date" value="${today()}"></div>
      <div class="form-group"><label class="form-label">Priorità</label><select class="form-select" id="t-priority"><option value="">Nessuna</option><option value="alta">Alta</option><option value="media">Media</option><option value="bassa">Bassa</option></select></div>
    </div>
    <div class="form-group"><label class="form-label">Assegna a</label>${collabSelectHtml()}</div>
    <div class="form-group"><label class="form-label">Note</label><textarea class="form-textarea" id="t-notes" style="min-height:55px;" placeholder="Note aggiuntive..."></textarea></div>
    <div class="modal-actions"><button class="btn" onclick="closeModal()">Annulla</button><button class="btn btn-primary" onclick="createTask('${status}')">Crea task</button></div>`);
}

function createTask(status){
  const title=document.getElementById('t-title').value.trim();if(!title)return;
  const artEl=document.getElementById('t-article');
  state.tasks.push({
    id:uid(),title,
    project:document.getElementById('t-project').value,
    article:artEl?artEl.value||null:null,
    due:document.getElementById('t-due').value||null,
    priority:document.getElementById('t-priority').value||null,

  });

}

function editTask(id){
  const t=state.tasks.find(x=>x.id===id);if(!t)return;
  const artOpts=t.project?state.articles.filter(a=>a.project===t.project).map(a=>`<option value="${a.id}"${a.id===t.article?' selected':''}>${a.title}</option>`).join(''):'';
  const artSel=artOpts?`<div class="form-group"><label class="form-label">Articolo</label><select class="form-select" id="t-article"><option value="">— Nessuno —</option>${artOpts}</select></div>`:'';
  openModal(`<div class="modal-title">Modifica task</div>
    <div class="form-group"><label class="form-label">Titolo</label><input class="form-input" id="t-title" value="${t.title}" autofocus></div>
    <div class="form-group"><label class="form-label">Stato</label><select class="form-select" id="t-status"><option value="todo"${t.status==='todo'?' selected':''}>Da fare</option><option value="inprogress"${t.status==='inprogress'?' selected':''}>In corso</option><option value="done"${t.done?' selected':''}>Fatto</option></select></div>
    ${artSel}
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
      <div class="form-group"><label class="form-label">Scadenza</label><input class="form-input" id="t-due" type="date" value="${t.due||''}"></div>
      <div class="form-group"><label class="form-label">Priorità</label><select class="form-select" id="t-priority"><option value="">Nessuna</option><option value="alta"${t.priority==='alta'?' selected':''}>Alta</option><option value="media"${t.priority==='media'?' selected':''}>Media</option><option value="bassa"${t.priority==='bassa'?' selected':''}>Bassa</option></select></div>
    </div>
    <div class="form-group"><label class="form-label">Assegna a</label>${collabSelectHtml(t.assignee||'')}</div>
    <div class="form-group"><label class="form-label">Note</label><textarea class="form-textarea" id="t-notes" style="min-height:55px;">${t.notes||''}</textarea></div>
    <div class="modal-actions">
      <button class="btn" style="color:var(--red);border-color:rgba(192,97,74,0.25)" onclick="deleteTask('${t.id}');closeModal()"><i class="fa-regular fa-trash-can"></i></button>
      <button class="btn" onclick="closeModal()">Annulla</button>
      <button class="btn btn-primary" onclick="saveTask('${t.id}')">Salva</button>
    </div>`);
}

function saveTask(id){
  const t=state.tasks.find(x=>x.id===id);if(!t)return;
  t.title=document.getElementById('t-title').value.trim()||t.title;
  const s=document.getElementById('t-status').value; t.status=s; t.done=s==='done';
  t.due=document.getElementById('t-due').value||null;
  t.priority=document.getElementById('t-priority').value||null;
  const artEl=document.getElementById('t-article');
  if(artEl)t.article=artEl.value||null;
  t.notes=document.getElementById('t-notes').value.trim();
  t.assignee=getSelectedCollab()||null;
  save();closeModal();refreshCurrent();
}

function showCalendar() {
  state.currentView='calendar'; state.currentProject=null;
  document.querySelectorAll('.sidebar-nav-item').forEach((e,i)=>i===3?e.classList.add('active'):e.classList.remove('active'));
  renderSidebar();
  document.getElementById('tab-bar').innerHTML='';

function renderCalendarView() {
  document.getElementById('topbar-title').innerHTML='<i class="fa-regular fa-calendar-days" style="margin-right:8px;color:var(--blue);font-size:18px;"></i>Calendario';
  document.getElementById('topbar-actions').innerHTML=`
    <button class="btn" onclick="calToday()"><i class="fa-regular fa-calendar-check"></i> Oggi</button>
    <button class="btn btn-primary" onclick="openNewTask(null)"><i class="fa-solid fa-plus"></i> Task</button>`;
  renderCalendarGrid();
}

function calToday() {
  state.calYear=new Date().getFullYear(); state.calMonth=new Date().getMonth();
  renderCalendarGrid();
}
function calPrev() {
  state.calMonth--; if(state.calMonth<0){state.calMonth=11;state.calYear--;}
  renderCalendarGrid();
}
function calNext() {
  state.calMonth++; if(state.calMonth>11){state.calMonth=0;state.calYear++;}
  renderCalendarGrid();
}

function renderCalendarGrid() {
  const y=state.calYear, m=state.calMonth;
  const MONTHS=['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
  const DAYS=['Lun','Mar','Mer','Gio','Ven','Sab','Dom'];

  const firstDay=new Date(y,m,1);
  const lastDay=new Date(y,m+1,0);
  const startDow=(firstDay.getDay()+6)%7; // Monday=0
  const totalDays=lastDay.getDate();
  const todayStr=today();

  // build cells: prev month padding + current + next month padding
  const cells=[];
  const prevLastDay=new Date(y,m,0).getDate();
  for(let i=startDow-1;i>=0;i--) cells.push({day:prevLastDay-i,curMonth:false,dateStr:''});
  for(let d=1;d<=totalDays;d++){
    const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    cells.push({day:d,curMonth:true,dateStr:ds,isToday:ds===todayStr});
  }
  const remaining=cells.length%7===0?0:7-(cells.length%7);
  for(let d=1;d<=remaining;d++) cells.push({day:d,curMonth:false,dateStr:''});

  // group tasks by date
  const tasksByDate={};
  state.tasks.forEach(t=>{if(t.due){if(!tasksByDate[t.due])tasksByDate[t.due]=[];tasksByDate[t.due].push(t);}});

  const calHtml=`
    <div class="cal-wrap">
      <div class="cal-header">
        <button class="cal-nav" onclick="calPrev()"><i class="fa-solid fa-chevron-left"></i></button>
        <div class="cal-month">${MONTHS[m]} ${y}</div>
        <button class="cal-nav" onclick="calNext()"><i class="fa-solid fa-chevron-right"></i></button>
      </div>
      <div class="cal-grid">
        ${DAYS.map(d=>`<div class="cal-day-label">${d}</div>`).join('')}
        ${cells.map(cell=>{
          const dayTasks=cell.dateStr?tasksByDate[cell.dateStr]||[]:[];
          const MAX_VISIBLE=3;
          const visible=dayTasks.slice(0,MAX_VISIBLE);
          const extra=dayTasks.length-MAX_VISIBLE;
          return`<div class="cal-cell${!cell.curMonth?' other-month':''}${cell.isToday?' today':''}">
            <div class="cal-date">${cell.day}</div>
            ${visible.map(t=>{
              const c=getCollab(t.assignee);
              const chipColor=c?c.color:getProjectColor(t.project);
              const proj=state.projects.find(x=>x.id===t.project);
              const art=t.article?state.articles.find(x=>x.id===t.article):null;
              return`<div class="cal-task-chip${t.done?' done-chip':''}" 
                style="background:${chipColor}22;color:${chipColor};" 
                onclick="editTask('${t.id}')" 
                title="${art?art.title+' — ':''} ${t.title}${proj?' — '+proj.name:''}${c?' — '+c.name:''}">
                <span style="width:6px;height:6px;border-radius:50%;background:${chipColor};flex-shrink:0;"></span>
                <span style="overflow:hidden;text-overflow:ellipsis;display:flex;flex-direction:column;gap:0;line-height:1.2;">
                  ${art?`<span style="font-size:8px;opacity:0.7;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${art.title}</span>`:''}
                  <span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${t.title}</span>
                </span>
              </div>`;
            }).join('')}
            ${extra>0?`<div class="cal-more" onclick="showDayTasks('${cell.dateStr}')">+${extra} altri</div>`:''}
          </div>`;
        }).join('')}
      </div>
    </div>
    ${renderCalendarLegend()}`;

  document.getElementById('main-content').innerHTML=calHtml;
}

function getProjectColor(pid) {
  const p=state.projects.find(x=>x.id===pid);
  return p?p.color:'var(--text3)';
}

function renderCalendarLegend() {
  if(!state.collaborators.length && !state.projects.length) return '';
  let html=`<div style="margin-top:16px;display:flex;gap:24px;flex-wrap:wrap;">`;
  if(state.collaborators.length) {
    html+=`<div><div class="section-title" style="margin-bottom:8px;">Collaboratori</div><div style="display:flex;flex-wrap:wrap;gap:8px;">`;
    state.collaborators.forEach(c=>{
      html+=`<span style="display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:${c.color};">
        ${avatarHtml(c.id)}<span>${c.name}</span>
      </span>`;
    });
    html+=`</div></div>`;
  }
  if(state.projects.length) {
    html+=`<div><div class="section-title" style="margin-bottom:8px;">Progetti</div><div style="display:flex;flex-wrap:wrap;gap:8px;">`;
    state.projects.forEach(p=>{
      const pt=projectTasks(p.id).filter(t=>t.due).length;
      if(!pt)return;
      html+=`<span style="display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:${p.color};">
        <span style="width:8px;height:8px;border-radius:50%;background:${p.color};"></span>${p.name}
      </span>`;
    });
    html+=`</div></div>`;
  }
  html+=`</div>`;
  return html;
}

function showDayTasks(dateStr) {
  const tasks=state.tasks.filter(t=>t.due===dateStr);

// ─── DUPLICA ARTICOLO ────────────────────────────────────────
function duplicateArticle(id) {
  const a = state.articles.find(x=>x.id===id); if(!a) return;
  const tasks = state.tasks.filter(t=>t.article===id);
  const dueDates = tasks.filter(t=>t.due).map(t=>t.due).sort();
  const origRef = dueDates[0] || today();
  openModal(`<div class="modal-title"><i class="fa-regular fa-copy" style="margin-right:8px;color:var(--accent);"></i>Duplica articolo</div>
    <div style="background:var(--surface2);border-radius:var(--radius);padding:12px 14px;margin-bottom:16px;font-size:13px;color:var(--text2);line-height:1.6;">
      Copia di <strong style="color:var(--text)">${a.title}</strong> con tutti i <strong>${tasks.length} task</strong> e le assegnazioni.<br>
      <span style="font-size:11px;color:var(--text3);">Le scadenze vengono ricalcolate mantenendo gli stessi intervalli. Data di riferimento originale: <strong>${origRef}</strong></span>
    </div>
    <div class="form-group">
      <label class="form-label">Titolo nuovo articolo</label>
      <input class="form-input" id="dup-title" value="${a.title} (copia)" autofocus>
    </div>
    <div class="form-group">
      <label class="form-label">Nuova data di inizio ciclo</label>
      <input class="form-input" id="dup-date" type="date" value="${today()}">
      <div style="font-size:11px;color:var(--text3);margin-top:4px;">Tutte le scadenze dei task vengono spostate proporzionalmente a partire da questa data.</div>
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">Annulla</button>
      <button class="btn btn-primary" onclick="confirmDuplicate('${id}','${origRef}')"><i class="fa-regular fa-copy"></i> Duplica</button>
    </div>`);
}

function confirmDuplicate(origId, origRefDate) {
  const a = state.articles.find(x=>x.id===origId); if(!a) return;
  const newTitle = document.getElementById('dup-title').value.trim() || a.title+' (copia)';
  const newStartStr = document.getElementById('dup-date').value || today();
  const msPerDay = 86400000;
  const origMs = new Date(origRefDate+'T12:00:00').getTime();
  const newMs  = new Date(newStartStr+'T12:00:00').getTime();
  const offsetDays = Math.round((newMs - origMs) / msPerDay);
  const newArt = { id:uid(), title:newTitle, desc:a.desc||'', project:a.project, created:today() };
  state.articles.push(newArt);
  const origTasks = state.tasks.filter(t=>t.article===origId);
  origTasks.forEach(t=>{
    let newDue = null;
    if(t.due) {
      const tMs = new Date(t.due+'T12:00:00').getTime();
      newDue = new Date(tMs + offsetDays*msPerDay).toISOString().slice(0,10);
    }
    state.tasks.push({
      id:uid(), title:t.title, project:t.project, article:newArt.id,
      due:newDue, priority:t.priority||null, notes:t.notes||'',
      assignee:t.assignee||null, status:'todo', done:false, created:today()
    });
  });
  save(); closeModal();
  showToast(`✓ Articolo duplicato con ${origTasks.length} task`);
  refreshCurrent();
}

      5. Salva — Make farà il resto ogni mattina ✓
    </div>
    <textarea id="tsv-preview" readonly style="width:100%;height:100px;font-family:'DM Mono',monospace;font-size:10px;background:var(--bg);border:1px solid var(--border2);border-radius:var(--radius);padding:8px;color:var(--text2);resize:none;line-height:1.5;">${tsv}</textarea>
    <div class="modal-actions" style="margin-top:12px;">
      <button class="btn" onclick="closeModal()">Chiudi</button>
      <button class="btn" onclick="downloadCSV()" style="color:var(--blue);border-color:rgba(106,144,168,0.3);"><i class="fa-solid fa-file-csv"></i> Scarica CSV</button>
      <button class="btn btn-primary" onclick="copyTSV()"><i class="fa-regular fa-copy"></i> Copia TSV</button>
    </div>`);
}

function copyTSV() {
  const txt = window._tsvData||'';
  if(navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(()=>{ showToast('✓ Copiato — incolla in Google Sheets con ⌘V'); closeModal(); }).catch(fallbackCopy);
  } else { fallbackCopy(); }
}
function fallbackCopy() {
  const ta=document.getElementById('tsv-preview'); if(ta){ta.select();try{document.execCommand('copy');}catch(e){}}
  showToast('✓ Copiato — incolla in Google Sheets con ⌘V'); closeModal();
}
function downloadCSV() {
  const csv=(window._tsvData||'').replace(/\t/g,',');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='projectos_tasks_'+today()+'.csv'; a.click(); URL.revokeObjectURL(a.href);
  showToast('✓ CSV scaricato');
}

// ─── HELPERS ─────────────────────────────────────────────────
function emptyState(icon,msg,btnFn){return`<div class="empty-state"><i class="fa-regular ${icon}"></i><p>${msg}</p>${btnFn?`<button class="btn btn-primary" onclick="${btnFn}()"><i class="fa-solid fa-plus"></i> Crea il primo</button>`:''}</div>`;}
function refreshCurrent(){
  if(state.currentView==='dashboard')showDashboard();
  else if(state.currentView==='alltasks')showAllTasks();
  else if(state.currentView==='allnotes')showAllNotes();
  else if(state.currentView==='calendar')renderCalendarGrid();
  else if(state.currentView==='collaborators')renderCollaboratorsContent();
  else renderProject();
}

load(); // load gestisce internamente renderSidebar() e showDashboard()
</script>
</body>
